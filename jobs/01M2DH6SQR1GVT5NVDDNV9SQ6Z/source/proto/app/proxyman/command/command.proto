syntax = "proto3";
package xray.app.proxyman.command;

import "common/protocol/user.proto";
import "common/serial/typed_message.proto";

// Trimmed, wire-compatible stub of Xray-core's HandlerService.
// We only need AlterInbound (used for live per-user add/remove), so the
// unrelated Add/Remove/List Inbound/Outbound messages are intentionally
// omitted -- protobuf wire format only cares about the field numbers and
// service/method names actually used on the wire, not the full sibling
// message set in the upstream .proto.

message AddUserOperation {
  xray.common.protocol.User user = 1;
}

message RemoveUserOperation {
  string email = 1;
}

message AlterInboundRequest {
  string tag = 1;
  xray.common.serial.TypedMessage operation = 2;
}

message AlterInboundResponse {}

service HandlerService {
  rpc AlterInbound(AlterInboundRequest) returns (AlterInboundResponse) {}
}
