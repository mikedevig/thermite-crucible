[package]
name = "exliatycl-client"
version = "1.0.3"
edition = "2021"
description = "Exliatycl node agent: registers with the control server, runs Hy2/Xray, heartbeats."
license = "UNLICENSED"
publish = false
rust-version = "1.80"

[[bin]]
name = "exliatycl-client"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
time = { version = "0.3", features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sysinfo = { version = "0.35", default-features = false, features = ["system", "network"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "process", "io-util", "net", "sync"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Real Xray-core gRPC API (HandlerService.AlterInbound) for live, no-restart
# per-user add/remove. See src/core/xray_api.rs.
prost = "0.13"
tonic = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
