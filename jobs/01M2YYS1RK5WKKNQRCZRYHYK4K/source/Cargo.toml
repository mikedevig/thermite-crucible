[package]
name = "mazebench"
version = "1.2.2"
edition = "2021"
description = "CPU benchmark via maze generation and solving"
homepage = "https://mazebench.mikeden.site/"

[[bin]]
name = "mazebench"
path = "src/main.rs"

[dependencies]
rand        = "0.8"
rand_chacha = "0.3"
ureq        = { version = "2", features = ["native-tls"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
# Pure-Rust XCB bindings - no libxcb/libX11 C dependency, no bindgen.
# Kept deliberately low-level (raw protocol requests) to match the
# Win32/GDI backend's philosophy: no widget toolkit, no retained-mode
# scene graph, just direct buffer writes and core X requests.
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_Globalization",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
	"Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
